<!DOCTYPE html>
<html>
<head>
    <title>Favicon Generator</title>
</head>
<body>
    <canvas id="favicon" width="32" height="32"></canvas>
    <script>
        const canvas = document.getElementById('favicon');
        const ctx = canvas.getContext('2d');
        
        // Create Windows XP style favicon
        // Background
        ctx.fillStyle = '#4a90e2';
        ctx.fillRect(0, 0, 32, 32);
        
        // Window frame
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(4, 4, 24, 24);
        
        // Title bar
        ctx.fillStyle = '#357abd';
        ctx.fillRect(4, 4, 24, 8);
        
        // Close button
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(24, 6, 4, 4);
        
        // Content area
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(6, 14, 20, 12);
        
        // Text lines
        ctx.fillStyle = '#333333';
        ctx.fillRect(8, 16, 12, 2);
        ctx.fillRect(8, 20, 16, 2);
        ctx.fillRect(8, 24, 8, 2);
        
        // Download link
        const link = document.createElement('a');
        link.download = 'favicon.png';
        link.href = canvas.toDataURL();
        link.textContent = 'Download Favicon';
        document.body.appendChild(link);
    </script>
</body>
</html>
